name: PhaseKit
on:
  push:
    branches: [main, beta]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
        env:
          RELEASE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm data:validate
      - run: pnpm data:build
      - run: pnpm tokens:build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Focused browser checks
        env:
          E2E_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Shared baseline plus regression specs supplied by this change.
          # This is a review contract, not app-source dependency inference.
          specs=(tests/e2e/phasekit.spec.ts tests/e2e/mobile-layout.spec.ts tests/e2e/release-history.spec.ts)
          git diff --no-renames --name-only --diff-filter=AM "$E2E_BASE" HEAD -- 'tests/e2e/*.spec.ts' > "$RUNNER_TEMP/e2e-changed-specs.txt"
          while IFS= read -r spec; do
            [[ -n "$spec" ]] && specs+=("$spec")
          done < "$RUNNER_TEMP/e2e-changed-specs.txt"
          printf 'Browser scope: %s\n' "${specs[@]}"
          pnpm exec playwright test "${specs[@]}" --project=desktop-chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: output/playwright/results
          retention-days: 7
